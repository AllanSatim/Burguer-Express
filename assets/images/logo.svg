  <text x="62" y="47" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="800" fill="#FFAA16" letter-spacing="1.5">EXPRESS</text>
